<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Conduit</title>
    <script>
      // Mockups are served from /<mockup_id>/. Resolve the base href at runtime so
      // deep links (/<id>/article/slug) load their assets and the router resolves.
      (function () {
        var seg = window.location.pathname.split('/')[1] || '';
        var base = document.createElement('base');
        base.setAttribute('href', seg ? '/' + seg + '/' : '/');
        document.head.appendChild(base);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Conduit — a place to share your knowledge." />
    <meta name="theme-color" content="#4f9d54" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Titillium+Web:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
