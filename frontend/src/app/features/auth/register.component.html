<div class="container page auth-page">
  <div class="auth-card panel">
    <h1 class="auth-title">Sign up</h1>
    <p class="auth-sub">
      Have an account? <a routerLink="/login">Sign in</a>
    </p>

    @if (errors().length > 0) {
      <ul class="alert alert-error" data-testid="register-errors">
        @for (message of errors(); track message) {
          <li>{{ message }}</li>
        }
      </ul>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label class="label" for="register-username">Username</label>
        <input
          id="register-username"
          class="input"
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="How should we credit you?"
        />
      </div>

      <div class="field">
        <label class="label" for="register-email">Email</label>
        <input
          id="register-email"
          class="input"
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          placeholder="you@example.com"
        />
      </div>

      <div class="field">
        <label class="label" for="register-password">Password</label>
        <input
          id="register-password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="At least 8 characters"
        />
      </div>

      <div class="field">
        <label class="label" for="register-confirm">Confirm password</label>
        <input
          id="register-confirm"
          class="input"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="Type it once more"
        />
      </div>

      <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creating account…' : 'Sign up' }}
      </button>
    </form>
  </div>
</div>
