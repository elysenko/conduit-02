<div class="container page auth-page">
  <div class="auth-card panel">
    <h1 class="auth-title">Sign in</h1>
    <p class="auth-sub">
      Need an account? <a routerLink="/register">Sign up</a>
    </p>

    @if (errors().length > 0) {
      <ul class="alert alert-error" data-testid="login-errors">
        @for (message of errors(); track message) {
          <li>{{ message }}</li>
        }
      </ul>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label class="label" for="login-email">Email</label>
        <input
          id="login-email"
          class="input"
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          placeholder="you@example.com"
        />
      </div>

      <div class="field">
        <label class="label" for="login-password">Password</label>
        <input
          id="login-password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="At least 8 characters"
        />
      </div>

      <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    @if (previewShortcut) {
      <button class="btn btn-quiet btn-block demo-btn" type="button" (click)="useDemoMode()">
        {{ previewShortcut }}
      </button>
    }
  </div>
</div>
