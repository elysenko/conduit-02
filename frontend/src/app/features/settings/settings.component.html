<div class="container page settings-page">
  <div class="settings-card panel">
    <h1 class="settings-title">Your Settings</h1>
    <p class="settings-sub">This is how other readers see you across Conduit.</p>

    @if (errors().length > 0) {
      <ul class="alert alert-error" data-testid="settings-errors">
        @for (message of errors(); track message) {
          <li>{{ message }}</li>
        }
      </ul>
    }
    @if (saved()) {
      <p class="alert saved-note" data-testid="settings-saved">Your settings have been updated.</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label class="label" for="settings-image">Profile picture URL</label>
        <input id="settings-image" class="input" type="url" formControlName="image" placeholder="https://…" />
      </div>

      <div class="field">
        <label class="label" for="settings-username">Username</label>
        <input id="settings-username" class="input" type="text" formControlName="username" autocomplete="username" />
      </div>

      <div class="field">
        <label class="label" for="settings-bio">Short bio</label>
        <textarea id="settings-bio" class="textarea" rows="5" formControlName="bio" placeholder="A sentence about you"></textarea>
      </div>

      <div class="field">
        <label class="label" for="settings-email">Email</label>
        <input id="settings-email" class="input" type="email" formControlName="email" autocomplete="email" inputmode="email" />
      </div>

      <div class="field">
        <label class="label" for="settings-password">New password</label>
        <input
          id="settings-password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Leave blank to keep your current password"
        />
        <p class="hint">Must be at least 8 characters.</p>
      </div>

      <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Saving…' : 'Update settings' }}
      </button>
    </form>

    <hr class="divider" />
    <button class="btn btn-danger btn-block" type="button" (click)="logout()">
      Or click here to log out
    </button>
  </div>
</div>
